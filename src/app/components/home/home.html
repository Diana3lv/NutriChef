<div class="home-container" [class.sidebar-expanded]="isSidebarExpanded()">
    <!-- Hero Section with Background Image -->
    <section class="hero-section">
        <div class="hero-content">
            <!-- Home title -->
            <h1 class="hero-title">
                Find your next delicious recipe
                to make today
            </h1>

            <!-- Search bar -->
            <app-search-bar 
                (search)="onSearch($event)" 
                (filterOpen)="onFilterOpen()">
            </app-search-bar>
        </div>
    </section>

    <div class="scroll-indicator" [class.hidden]="!showScrollIndicator()">
        <img src="assets/images/icons/scroll_down.svg" alt="Scroll Down" class="scroll-icon">
    </div>
    
    <!-- Popular Recipes Section -->
    <section class="recipes-section">
        <h2 class="section-title">Popular Recipes</h2>
        <div class="recipe-grid">
            <app-recipe-card 
                *ngFor="let recipe of popularRecipes"
                [recipe]="recipe"
                (cardClick)="viewRecipe($event)">
            </app-recipe-card>
        </div>
    </section>

    <!-- Recommended Recipes Section -->
    <section class="recipes-section">
        <h2 class="section-title">Recommended Recipes</h2>
        <div class="recipe-grid">
            <app-recipe-card 
                *ngFor="let recipe of recommendedRecipes"
                [recipe]="recipe"
                (cardClick)="viewRecipe($event)">
            </app-recipe-card>
        </div>
    </section>
</div>
